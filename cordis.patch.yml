# 起笔写作台（dsh-qibi）
#
# 一行插入：Host 半边负责打开本机 novelforge.db、在共享 /api 通道上注册 /api/qibi
# 精确路由与 qibi_* 工具；Client 半边由本包的 dsh.client 声明的 ./client 自动装载
# （左侧栏图标 + 中央写作台）。
#
# config 可改项：
#   allowWrite  是否允许插件写入起笔数据库（默认 true；每次覆盖前自动备份到 chapter_revisions）
#   dataDir     默认 Windows D:\dsh-qibi\data；没有 D 盘时使用用户目录下的 dsh-qibi/data。
#               可从面板“数据位置”修改，首次新建为空库，不导入已有测试书稿。
#   userId      固定使用哪个起笔用户（默认取第一个拥有作品的未禁用用户）

- insert:
    - id: qibi
      name: dsh-qibi
      config:
        allowWrite: true
