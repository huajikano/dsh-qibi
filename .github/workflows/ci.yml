name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 提交的 client.js 必须与 src/ 重新构建的结果逐字节一致，
      # 否则用户装到的界面可能与仓库源码不同。
      - name: Verify committed client build
        run: npm run check:build

      # 全部检查使用临时夹具与模型替身，不需要书稿、密钥或网络模型。
      - name: Run regression suite
        run: npm run test:release
